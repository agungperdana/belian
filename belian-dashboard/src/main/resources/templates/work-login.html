<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f5f1">
    <meta name="description" content="Sign in to Belian ERP with your work account.">
    <title>Work account | Belian ERP</title>
    <link rel="icon" type="image/svg+xml" href="/images/belian-mark.svg" th:href="@{/images/belian-mark.svg}">
    <link rel="stylesheet" href="/css/landing.css" th:href="@{/css/landing.css}">
</head>
<body>
<main class="auth-page">
    <section class="auth-card" aria-labelledby="page-title">
        <a class="back-link" href="/" th:href="@{/}">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10H4m5-5-5 5 5 5"/></svg>
            All sign-in options
        </a>

        <a class="brand compact-brand" href="/" th:href="@{/}" aria-label="Belian ERP home">
            <span class="brand-mark" aria-hidden="true">
                <img src="/images/belian-mark.svg" th:src="@{/images/belian-mark.svg}" alt="">
            </span>
            <span>Belian ERP</span>
        </a>

        <div class="provider-heading">
            <span class="provider-mark credentials-icon" aria-hidden="true">
                <svg viewBox="0 0 28 28">
                    <circle cx="14" cy="10" r="4"/>
                    <path d="M6.5 23c.7-5 3.2-7.5 7.5-7.5s6.8 2.5 7.5 7.5"/>
                </svg>
            </span>
            <h1 id="page-title">Work account</h1>
            <p>Enter the credentials issued by your organization.</p>
        </div>

        <div class="auth-form">
            <label>
                <span>Username or work email</span>
                <input type="text" name="username" autocomplete="username"
                       placeholder="name@company.com" autofocus required>
            </label>
            <label>
                <span>Password</span>
                <input type="password" name="password" autocomplete="current-password"
                       placeholder="Enter your password" required>
            </label>
            <a class="primary-action" href="/home" th:href="@{/home}">
                Sign in
                <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12m-5-5 5 5-5 5"/></svg>
            </a>
        </div>
    </section>
</main>
</body>
</html>
