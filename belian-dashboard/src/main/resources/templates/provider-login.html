<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f5f1">
    <meta name="description" th:content="|Sign in to Belian ERP with ${provider.name}.|">
    <title th:text="|${provider.title} - Belian ERP|">Provider | Belian ERP</title>
    <link rel="icon" type="image/svg+xml" href="/images/belian-mark.svg" th:href="@{/images/belian-mark.svg}">
    <link rel="stylesheet" href="/css/landing.css" th:href="@{/css/landing.css}">
</head>
<body>
<main class="auth-page">
    <section class="auth-card" aria-labelledby="page-title">
        <a class="back-link" href="/" th:href="@{/}">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10H4m5-5-5 5 5 5"/></svg>
            All sign-in options
        </a>

        <a class="brand compact-brand" href="/" th:href="@{/}" aria-label="Belian ERP home">
            <span class="brand-mark" aria-hidden="true">
                <img src="/images/belian-mark.svg" th:src="@{/images/belian-mark.svg}" alt="">
            </span>
            <span>Belian ERP</span>
        </a>

        <div class="provider-heading">
            <span class="provider-mark google-icon" th:if="${provider.id == 'google'}" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.5-.2-2.2H12v4.3h5.4a4.7 4.7 0 0 1-2 3v2.8h3.5c2-1.9 2.7-4.6 2.7-7.9Z"/>
                    <path fill="#34A853" d="M12 22c2.7 0 5-.9 6.8-2.4l-3.4-2.7c-.9.6-2.1 1-3.4 1a6 6 0 0 1-5.6-4.1H2.9v2.8A10.3 10.3 0 0 0 12 22Z"/>
                    <path fill="#FBBC05" d="M6.4 13.8A6.2 6.2 0 0 1 6.1 12c0-.6.1-1.2.3-1.8V7.4H2.9A10.1 10.1 0 0 0 1.8 12c0 1.6.4 3.2 1.1 4.6l3.5-2.8Z"/>
                    <path fill="#EA4335" d="M12 6.1c1.5 0 2.8.5 3.9 1.5l2.9-2.9A9.8 9.8 0 0 0 12 2a10.3 10.3 0 0 0-9.1 5.4l3.5 2.8A6 6 0 0 1 12 6.1Z"/>
                </svg>
            </span>
            <span class="provider-mark facebook-icon" th:if="${provider.id == 'facebook'}" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <path d="M14 21v-8h2.8l.4-3H14V8.1c0-.9.3-1.5 1.6-1.5h1.7V3.9c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3V10H8v3h2.6v8H14Z"/>
                </svg>
            </span>
            <span class="provider-mark instagram-icon" th:if="${provider.id == 'instagram'}" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                    <rect x="4" y="4" width="16" height="16" rx="5"/>
                    <circle cx="12" cy="12" r="3.6"/>
                    <circle class="instagram-dot" cx="17.2" cy="6.9" r="1"/>
                </svg>
            </span>

            <h1 id="page-title" th:text="${provider.title}">Provider</h1>
            <p th:text="${provider.description}">Continue with your organization account.</p>
        </div>

        <a class="primary-action provider-action" href="/home" th:href="@{/home}">
            <span th:text="|Continue with ${provider.name}|">Continue</span>
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h12m-5-5 5 5-5 5"/></svg>
        </a>
    </section>
</main>
</body>
</html>
