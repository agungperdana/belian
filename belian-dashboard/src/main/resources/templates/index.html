<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f5f1">
    <meta name="description" content="Secure access to Belian ERP.">
    <title>Belian ERP | Sign in</title>
    <link rel="icon" type="image/svg+xml" href="/images/belian-mark.svg" th:href="@{/images/belian-mark.svg}">
    <link rel="stylesheet" href="/css/landing.css" th:href="@{/css/landing.css}">
</head>
<body>
<main class="login-page">
    <section class="login-shell" aria-labelledby="page-title">
        <a class="brand" href="/" aria-label="Belian ERP home">
            <span class="brand-mark" aria-hidden="true">
                <img src="/images/belian-mark.svg" th:src="@{/images/belian-mark.svg}" alt="">
            </span>
            <span>Belian ERP</span>
        </a>

        <div class="heading">
            <h1 id="page-title">Sign in to your workspace</h1>
            <p>Choose an account to continue.</p>
        </div>

        <nav class="auth-options" aria-label="Sign-in methods">
            <a class="auth-option" href="/login/work" th:href="@{/login/work}">
                <span class="icon-frame credentials-icon" aria-hidden="true">
                    <svg viewBox="0 0 28 28">
                        <circle cx="14" cy="10" r="4"/>
                        <path d="M6.5 23c.7-5 3.2-7.5 7.5-7.5s6.8 2.5 7.5 7.5"/>
                    </svg>
                </span>
                <span>Work account</span>
            </a>

            <a class="auth-option" href="/login/google" th:href="@{/login/google}">
                <span class="icon-frame google-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M21.6 12.2c0-.7-.1-1.5-.2-2.2H12v4.3h5.4a4.7 4.7 0 0 1-2 3v2.8h3.5c2-1.9 2.7-4.6 2.7-7.9Z"/>
                        <path fill="#34A853" d="M12 22c2.7 0 5-.9 6.8-2.4l-3.4-2.7c-.9.6-2.1 1-3.4 1a6 6 0 0 1-5.6-4.1H2.9v2.8A10.3 10.3 0 0 0 12 22Z"/>
                        <path fill="#FBBC05" d="M6.4 13.8A6.2 6.2 0 0 1 6.1 12c0-.6.1-1.2.3-1.8V7.4H2.9A10.1 10.1 0 0 0 1.8 12c0 1.6.4 3.2 1.1 4.6l3.5-2.8Z"/>
                        <path fill="#EA4335" d="M12 6.1c1.5 0 2.8.5 3.9 1.5l2.9-2.9A9.8 9.8 0 0 0 12 2a10.3 10.3 0 0 0-9.1 5.4l3.5 2.8A6 6 0 0 1 12 6.1Z"/>
                    </svg>
                </span>
                <span>Google</span>
            </a>

            <a class="auth-option" href="/login/facebook" th:href="@{/login/facebook}">
                <span class="icon-frame facebook-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <path d="M14 21v-8h2.8l.4-3H14V8.1c0-.9.3-1.5 1.6-1.5h1.7V3.9c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3V10H8v3h2.6v8H14Z"/>
                    </svg>
                </span>
                <span>Facebook</span>
            </a>

            <a class="auth-option" href="/login/instagram" th:href="@{/login/instagram}">
                <span class="icon-frame instagram-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24">
                        <rect x="4" y="4" width="16" height="16" rx="5"/>
                        <circle cx="12" cy="12" r="3.6"/>
                        <circle class="instagram-dot" cx="17.2" cy="6.9" r="1"/>
                    </svg>
                </span>
                <span>Instagram</span>
            </a>
        </nav>

        <p class="security-caption">
            <svg viewBox="0 0 18 18" aria-hidden="true">
                <rect x="3.5" y="7.5" width="11" height="8" rx="2"/>
                <path d="M6 7.5V5.8a3 3 0 0 1 6 0v1.7"/>
            </svg>
            Secure enterprise access
        </p>
    </section>
</main>
</body>
</html>
